<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiveCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23101816'/%3E%3Cpath d='M8 17.5c3.2-6 6.4-9 8-9s4.8 3 8 9' stroke='%2334d399' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg0: #e9f1ed;
      --bg1: #f6faf8;
      --ink: #101816;
      --ink-2: #2a3d36;
      --mute: #6a7d75;
      --line: rgba(16, 24, 22, 0.1);
      --line-strong: rgba(16, 24, 22, 0.16);
      --surface: rgba(255, 255, 255, 0.78);
      --surface-2: #ffffff;
      --teal: #0e7a6c;
      --teal-soft: #d8f5ec;
      --mint: #34d399;
      --ok: #067a55;
      --danger: #b42318;
      --shadow: 0 1px 0 rgba(255,255,255,0.65) inset, 0 18px 40px rgba(16, 24, 22, 0.08);
      --radius: 20px;
      --radius-sm: 12px;
      --pad: 1rem;
      --gap: 0.85rem;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Sora, system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 8% -8%, rgba(52, 211, 153, 0.22), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(14, 122, 108, 0.12), transparent 55%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 45%, #eef4f1);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: min(1240px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.15rem 0 2rem;
      display: grid;
      gap: 0.9rem;
      animation: rise 0.55s var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 0.95rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .brand-block { min-width: 0; }
    .brand {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.55rem, 2.4vw, 1.95rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand em {
      font-style: normal;
      color: var(--teal);
    }
    .tagline {
      margin: 0.35rem 0 0;
      color: var(--mute);
      font-size: 0.86rem;
      line-height: 1.35;
    }
    .room-box {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 0.45rem;
      align-items: center;
      min-width: min(420px, 100%);
      padding: 0.35rem;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .room-box label {
      padding-left: 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .room-box input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font: inherit;
      font-weight: 600;
      color: var(--ink);
      padding: 0.45rem 0.2rem;
    }
    #roomStatus {
      justify-self: end;
      font-size: 0.78rem;
      color: var(--mute);
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
      gap: var(--gap);
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .stage-card { padding: 0.75rem; }
    .stage {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      background:
        linear-gradient(145deg, #0f1c18 0%, #132821 50%, #0c1714 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 28%;
      background: linear-gradient(to top, rgba(0,0,0,0.35), transparent);
      pointer-events: none;
      opacity: 0.7;
    }
    .stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #tapPlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      border: 0;
      cursor: pointer;
      color: #fff;
      font: inherit;
      font-weight: 600;
      background: rgba(8, 16, 14, 0.48);
      backdrop-filter: blur(2px);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.55rem;
      margin-top: 0.75rem;
    }
    .metric {
      padding: 0.75rem 0.8rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
      min-height: 4.1rem;
    }
    .metric label {
      display: block;
      margin-bottom: 0.28rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .metric strong {
      display: block;
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ink-2);
      word-break: break-word;
    }
    .metric strong.yes { color: var(--ok); }
    .metric strong.no { color: var(--mute); }

    .side {
      display: grid;
      gap: var(--gap);
      min-width: 0;
    }
    .card {
      padding: 0.9rem;
      display: grid;
      gap: 0.65rem;
      min-height: 0;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .card-head h2 {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .status-chip {
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--teal);
      background: var(--teal-soft);
      border-radius: 999px;
      padding: 0.22rem 0.55rem;
    }

    .toolbar-inline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: center;
      padding: 0.4rem 0.5rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .toolbar-inline label {
      font-size: 0.74rem;
      color: var(--mute);
      font-weight: 500;
      padding-left: 0.25rem;
    }
    .toolbar-inline .right {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    select, input[type="number"] {
      border: 0;
      outline: none;
      background: transparent;
      font: inherit;
      font-weight: 600;
      color: var(--ink);
    }

    .feed {
      min-height: 9.5rem;
      max-height: 15rem;
      overflow: auto;
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 0.92rem;
      scrollbar-width: thin;
    }
    .feed:empty::before {
      content: attr(data-empty);
      color: var(--mute);
      font-size: 0.86rem;
    }
    #translateBox {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.05rem;
      font-weight: 560;
      background: linear-gradient(180deg, #f1fbf7, #ffffff);
    }
    .feed .row { margin-bottom: 0.7rem; }
    .feed .row:last-child { margin-bottom: 0; }
    .feed .src {
      display: block;
      margin-bottom: 0.18rem;
      font-family: Sora, sans-serif;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--mute);
    }

    .actions {
      padding: 0.95rem 1.05rem;
      display: grid;
      gap: 0.75rem;
    }
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .actions-row.secondary {
      padding-top: 0.75rem;
      border-top: 1px solid var(--line);
    }
    .field {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 2.5rem;
      padding: 0.25rem 0.55rem 0.25rem 0.75rem;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 0.86rem;
    }
    .field label {
      color: var(--mute);
      font-size: 0.74rem;
      font-weight: 500;
      white-space: nowrap;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      min-height: 2.5rem;
      padding: 0.55rem 0.95rem;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), background 0.18s ease, border-color 0.18s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: var(--ink);
      color: #f4fffb;
      box-shadow: 0 10px 22px rgba(16, 24, 22, 0.2);
    }
    .btn-accent {
      background: var(--teal);
      color: #fff;
      box-shadow: 0 10px 22px rgba(14, 122, 108, 0.22);
    }
    .btn-ghost {
      background: var(--surface-2);
      border-color: var(--line-strong);
      color: var(--ink-2);
    }
    .btn-compact {
      min-height: 2.1rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 10px;
    }
    #publisherControls { display: none; }
    #publisherControls.is-open { display: flex; }

    details.logs {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.55);
      padding: 0.2rem 1rem 0.8rem;
    }
    details.logs summary {
      cursor: pointer;
      list-style: none;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--ink-2);
      padding: 0.75rem 0;
    }
    details.logs summary::-webkit-details-marker { display: none; }
    #logs {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem;
      line-height: 1.5;
      color: var(--mute);
      max-height: 150px;
      overflow: auto;
    }

    .banner {
      display: none;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      border: 1px solid rgba(180, 83, 9, 0.28);
      background: #fff7ed;
      color: #9a3412;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .banner.is-on { display: flex; }
    .banner a { color: #9a3412; font-weight: 700; }
    .toast-err {
      color: var(--danger);
      font-size: 0.86rem;
      font-weight: 600;
      min-height: 1.2rem;
    }

    #answerStatus, #answerBox { display: none !important; }

    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      .topbar { grid-template-columns: 1fr; }
      .room-box { min-width: 0; }
      #roomStatus { grid-column: 1 / -1; justify-self: start; padding: 0 0.55rem 0.35rem; }
    }
    @media (max-width: 640px) {
      .shell { width: min(100% - 1.1rem, 1240px); }
      .metrics { grid-template-columns: 1fr; }
      .room-box { grid-template-columns: 1fr 1fr; }
      .room-box label { grid-column: 1 / -1; padding-top: 0.25rem; }
      .room-box input { grid-column: 1 / -1; padding: 0.2rem 0.55rem 0.45rem; }
      #joinBtn, #publishBtn, #allowCamBtn {
        width: 100%;
        min-height: 3rem;
        font-size: 1rem;
      }
      .actions-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="secureBanner" class="banner" role="status"></div>
    <header class="topbar">
      <div class="brand-block">
        <h1 class="brand">Live<em>Cast</em></h1>
        <p class="tagline">Rooms · live captions · translation · face intelligence</p>
      </div>
      <div>
        <div class="room-box">
          <label for="roomId">Room</label>
          <input id="roomId" type="text" maxlength="24" placeholder="code" autocomplete="off" spellcheck="false">
          <button id="newRoomBtn" class="btn-ghost btn-compact" type="button">New</button>
          <button id="copyRoomBtn" class="btn-ghost btn-compact" type="button">Copy link</button>
        </div>
        <div id="roomStatus">Set a room to start</div>
      </div>
    </header>

    <div class="workspace">
      <section class="panel stage-card">
        <div class="stage">
          <video id="video1" autoplay playsinline muted></video>
          <button id="tapPlay" type="button">Tap to play / unmute</button>
        </div>
        <div class="metrics">
          <div class="metric">
            <label>Live faces</label>
            <strong id="faceStatus" class="no">waiting…</strong>
          </div>
          <div class="metric">
            <label>Unique in window</label>
            <strong id="uniqueStatus">—</strong>
          </div>
          <div class="metric">
            <label>Audio</label>
            <strong id="audioStatus">—</strong>
          </div>
        </div>
      </section>

      <aside class="side">
        <section class="panel card">
          <div class="card-head">
            <h2>Transcript</h2>
            <span id="transcriptStatus" class="status-chip">waiting…</span>
          </div>
          <div id="transcriptBox" class="feed" data-empty="Speech will appear here after Publish."></div>
        </section>

        <section class="panel card">
          <div class="card-head">
            <h2>Translation</h2>
            <span id="translateStatus" class="status-chip">waiting…</span>
          </div>
          <div class="toolbar-inline">
            <label for="targetLang">Translate to</label>
            <div class="right">
              <select id="targetLang">
                <option value="en" selected>English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="kn">Kannada</option>
                <option value="ml">Malayalam</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
              </select>
              <button id="applyTranslateBtn" class="btn-ghost btn-compact" type="button">Apply</button>
            </div>
          </div>
          <div id="translateBox" class="feed" data-empty="Live translation shows here."></div>
        </section>
      </aside>
    </div>

    <section class="panel actions">
      <div class="actions-row">
        <button id="allowCamBtn" class="btn-primary" type="button">Allow camera</button>
        <button id="publishBtn" class="btn-accent" type="button" disabled>Publish</button>
        <button id="joinBtn" class="btn-ghost" type="button">Join broadcast</button>
        <button id="unmuteBtn" class="btn-ghost" type="button" style="display:none">Enable sound</button>
      </div>
      <div id="camHint" class="toast-err"></div>
      <div class="actions-row secondary">
        <div class="field">
          <label for="windowSec">Unique window</label>
          <select id="windowSec">
            <option value="60">1 minute</option>
            <option value="300" selected>5 minutes</option>
            <option value="900">15 minutes</option>
            <option value="1800">30 minutes</option>
            <option value="3600">1 hour</option>
            <option value="custom">Custom…</option>
          </select>
          <input id="windowCustom" type="number" min="30" max="86400" placeholder="sec" style="width:4.2rem;display:none">
          <button id="applyWindowBtn" class="btn-ghost btn-compact" type="button">Apply</button>
        </div>
        <div id="publisherControls" class="actions-row">
          <button id="screenBtn" class="btn-ghost" type="button">Share screen</button>
          <button id="stopShareBtn" class="btn-ghost" type="button" disabled>Stop sharing</button>
          <button id="muteMicBtn" class="btn-ghost" type="button">Mute mic</button>
        </div>
      </div>
    </section>

    <p id="answerStatus"></p>
    <div id="answerBox"></div>

    <details class="logs">
      <summary>Session logs</summary>
      <div id="logs"></div>
    </details>
  </div>

  <script>
    const log = (msg) => {
      const el = document.getElementById('logs')
      el.innerHTML += msg + '<br>'
      el.scrollTop = el.scrollHeight
    }

    const video = document.getElementById('video1')
    const faceStatus = document.getElementById('faceStatus')
    const uniqueStatus = document.getElementById('uniqueStatus')
    const audioStatus = document.getElementById('audioStatus')
    const transcriptStatus = document.getElementById('transcriptStatus')
    const transcriptBox = document.getElementById('transcriptBox')
    const translateStatus = document.getElementById('translateStatus')
    const translateBox = document.getElementById('translateBox')
    const targetLang = document.getElementById('targetLang')
    const applyTranslateBtn = document.getElementById('applyTranslateBtn')
    const answerStatus = document.getElementById('answerStatus')
    const answerBox = document.getElementById('answerBox')
    const windowSec = document.getElementById('windowSec')
    const windowCustom = document.getElementById('windowCustom')
    const applyWindowBtn = document.getElementById('applyWindowBtn')
    const tapPlay = document.getElementById('tapPlay')
    const unmuteBtn = document.getElementById('unmuteBtn')
    const allowCamBtn = document.getElementById('allowCamBtn')
    const camHint = document.getElementById('camHint')
    const secureBanner = document.getElementById('secureBanner')
    const publishBtn = document.getElementById('publishBtn')
    const joinBtn = document.getElementById('joinBtn')
    const screenBtn = document.getElementById('screenBtn')
    const stopShareBtn = document.getElementById('stopShareBtn')
    const muteMicBtn = document.getElementById('muteMicBtn')
    const publisherControls = document.getElementById('publisherControls')

    function isLocalHost() {
      const h = location.hostname
      return h === 'localhost' || h === '127.0.0.1' || h === '[::1]'
    }

    function cameraAvailable() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    }

    function showCamError(msg) {
      camHint.textContent = msg
      log(msg)
      const logs = document.querySelector('details.logs')
      if (logs) logs.open = true
    }

    if (!window.isSecureContext && !isLocalHost()) {
      const httpsURL = 'https://' + location.host + location.search
      const local = 'http://127.0.0.1:8081' + location.search
      secureBanner.classList.add('is-on')
      secureBanner.innerHTML =
        'Camera needs HTTPS on LAN. Open <a href="' + httpsURL + '">' + httpsURL + '</a> ' +
        '(accept the certificate warning), or use <a href="' + local + '">' + local + '</a> on this PC.'
    } else if (!cameraAvailable()) {
      secureBanner.classList.add('is-on')
      secureBanner.textContent = 'Camera API unavailable in this browser context.'
    }

    const roomIdInput = document.getElementById('roomId')
    const newRoomBtn = document.getElementById('newRoomBtn')
    const copyRoomBtn = document.getElementById('copyRoomBtn')
    const roomStatus = document.getElementById('roomStatus')

    let roomId = ''
    const params = new URLSearchParams(location.search)
    if (params.get('room')) {
      roomId = params.get('room')
      roomIdInput.value = roomId
      roomStatus.textContent = 'Active · ' + roomId
    }

    function currentRoom() {
      return (roomIdInput.value || roomId || '').trim()
    }

    function setRoom(id) {
      roomId = (id || '').trim()
      roomIdInput.value = roomId
      roomStatus.textContent = roomId ? ('Active · ' + roomId) : 'Set a room to start'
      const url = new URL(location.href)
      if (roomId) url.searchParams.set('room', roomId)
      else url.searchParams.delete('room')
      history.replaceState(null, '', url)
    }

    function roomQS() {
      const r = currentRoom()
      return r ? ('room=' + encodeURIComponent(r) + '&') : ''
    }

    newRoomBtn.onclick = async () => {
      try {
        const res = await fetch('/room/new', { method: 'POST' })
        const data = await res.json()
        setRoom(data.room)
        log('New room: ' + data.room)
      } catch (e) {
        log('New room failed: ' + e)
      }
    }
    copyRoomBtn.onclick = async () => {
      const r = currentRoom()
      if (!r) { log('Set a room first'); return }
      setRoom(r)
      const link = location.origin + '/?room=' + encodeURIComponent(r)
      try {
        await navigator.clipboard.writeText(link)
        log('Copied: ' + link)
      } catch (_) {
        log('Share link: ' + link)
      }
    }
    roomIdInput.onchange = () => setRoom(roomIdInput.value)
    roomIdInput.onkeydown = (e) => { if (e.key === 'Enter') setRoom(roomIdInput.value) }

    let pc, videoSender, audioSender
    let sharedStream = null, screenStream = null
    let playArmed = false, isViewer = false, sharingScreen = false, micMuted = false
    let facePollTimer = null
    let transcriptPollTimer = null
    let answerPollTimer = null
    let translatePollTimer = null
    let lastTranscriptLine = ''
    let lastAnswerKey = ''
    let lastTranslateKey = ''

    function applyFaceStatus(payload) {
      const count = Number(payload.count || 0)
      const present = !!payload.present || count > 0
      const conf = payload.confidence ? Math.round(Number(payload.confidence) * 100) : 0
      const unique = Number(payload.unique_count || 0)
      const win = Number(payload.window_sec || 0)
      if (present && count > 0) {
        faceStatus.textContent = count + ' · ' + conf + '%'
        faceStatus.className = 'yes'
      } else {
        faceStatus.textContent = unique > 0 ? 'none (tracking)' : 'none'
        faceStatus.className = 'no'
      }
      const mins = !win ? '—' : (win >= 60 ? (win / 60) + ' min' : win + 's')
      uniqueStatus.textContent = unique + ' / ' + mins
    }

    function applyTranscript(payload) {
      const text = (payload.text || '').trim()
      const status = payload.status || ''
      const lang = payload.lang ? (' · ' + payload.lang) : ''
      const extra = payload.buffered_sec != null ? (' · lag ' + payload.buffered_sec + 's') : ''
      transcriptStatus.textContent = (status || 'listening') + lang + extra
      if (!text) return
      if (text === lastTranscriptLine) return
      lastTranscriptLine = text
      let live = transcriptBox.querySelector('.live-caption')
      if (!live) {
        transcriptBox.innerHTML = ''
        live = document.createElement('div')
        live.className = 'row live-caption'
        transcriptBox.appendChild(live)
      }
      live.textContent = text
      transcriptBox.scrollTop = transcriptBox.scrollHeight
    }

    function applyTranslate(payload) {
      const src = (payload.source || '').trim()
      const tr = (payload.translated || '').trim()
      const status = payload.status || ''
      const target = payload.target || ''
      if (status === 'translating') {
        translateStatus.textContent = 'translating → ' + target
        return
      }
      if (status === 'error') {
        translateStatus.textContent = 'error'
        log('Translate error: ' + (payload.error || ''))
        return
      }
      if (status === 'same') {
        translateStatus.textContent = 'already ' + target
      } else {
        translateStatus.textContent = 'live → ' + target
      }
      const key = src + '|' + tr
      if (tr && key !== lastTranslateKey) {
        lastTranslateKey = key
        const block = document.createElement('div')
        block.className = 'row'
        if (src && src !== tr) {
          block.innerHTML = '<span class="src">' + escapeHtml(src) + '</span>' + escapeHtml(tr)
        } else {
          block.textContent = tr
        }
        translateBox.appendChild(block)
        translateBox.scrollTop = translateBox.scrollHeight
      }
    }

    function applyAnswer(payload) {
      const q = (payload.question || '').trim()
      const a = (payload.answer || '').trim()
      const status = payload.status || ''
      if (status === 'thinking' || status === 'error' || !a) return
      const key = q + '|' + a
      if (key !== lastAnswerKey) {
        lastAnswerKey = key
        answerBox.innerHTML += '<div><b>Q:</b> ' + escapeHtml(q) + '<br><b>A:</b> ' + escapeHtml(a) + '</div>'
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    applyTranslateBtn.onclick = async () => {
      try {
        const res = await fetch('/translate-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target_lang: targetLang.value, enabled: true })
        })
        const data = await res.json()
        log('Translate target: ' + data.target_lang)
      } catch (e) {
        log('Translate config failed: ' + e)
      }
    }
    ;(async () => {
      try {
        const res = await fetch('/translate-config')
        const data = await res.json()
        if (data.target_lang) targetLang.value = data.target_lang
      } catch (_) {}
    })()

    windowSec.onchange = () => {
      windowCustom.style.display = windowSec.value === 'custom' ? 'inline-block' : 'none'
    }

    applyWindowBtn.onclick = async () => {
      let sec = windowSec.value === 'custom'
        ? Number(windowCustom.value || 300)
        : Number(windowSec.value)
      if (!sec || sec < 30) sec = 30
      try {
        const res = await fetch('/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ window_sec: sec })
        })
        const data = await res.json()
        log('Unique window set to ' + data.window_sec + 's')
      } catch (e) {
        log('Config failed: ' + e)
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch('/config')
        const data = await res.json()
        const sec = Number(data.window_sec || 300)
        const opt = [...windowSec.options].find((o) => o.value === String(sec))
        if (opt) windowSec.value = String(sec)
        else {
          windowSec.value = 'custom'
          windowCustom.style.display = 'inline-block'
          windowCustom.value = String(sec)
        }
      } catch (_) {}
    }
    loadConfig()

    function startFacePolling() {
      if (facePollTimer) return
      const tick = async () => {
        try {
          const res = await fetch('/face?' + roomQS() + Date.now(), { cache: 'no-store' })
          if (res.ok) applyFaceStatus(await res.json())
        } catch (_) {}
      }
      tick()
      facePollTimer = setInterval(tick, 300)
    }
    startFacePolling()

    function startTranscriptPolling() {
      if (transcriptPollTimer) return
      const tick = async () => {
        try {
          const res = await fetch('/transcript?' + roomQS() + Date.now(), { cache: 'no-store' })
          if (res.ok) applyTranscript(await res.json())
        } catch (_) {}
      }
      tick()
      transcriptPollTimer = setInterval(tick, 250)
    }
    startTranscriptPolling()

    function startAnswerPolling() {
      if (answerPollTimer) return
      const tick = async () => {
        try {
          const res = await fetch('/answer?' + roomQS() + Date.now(), { cache: 'no-store' })
          if (res.ok) applyAnswer(await res.json())
        } catch (_) {}
      }
      tick()
      answerPollTimer = setInterval(tick, 800)
    }
    startAnswerPolling()

    function startTranslatePolling() {
      if (translatePollTimer) return
      const tick = async () => {
        try {
          const res = await fetch('/translate?' + roomQS() + Date.now(), { cache: 'no-store' })
          if (res.ok) applyTranslate(await res.json())
        } catch (_) {}
      }
      tick()
      translatePollTimer = setInterval(tick, 400)
    }
    startTranslatePolling()

    function updateAudioStatus() {
      if (!isViewer) {
        audioStatus.textContent = micMuted ? 'MUTED' : 'ON (preview muted)'
        return
      }
      audioStatus.textContent = video.muted ? 'muted' : 'ON'
      unmuteBtn.style.display = video.muted ? 'inline-block' : 'none'
    }

    function setSharingUI(active) {
      sharingScreen = active
      screenBtn.disabled = active
      stopShareBtn.disabled = !active
      screenBtn.textContent = active ? 'Sharing…' : 'Share screen'
    }

    async function enableSound() {
      try {
        video.muted = false
        video.volume = 1
        await video.play()
        tapPlay.style.display = 'none'
        playArmed = true
        updateAudioStatus()
      } catch (e) {
        tapPlay.style.display = 'block'
        log('unmute blocked: ' + e)
      }
    }
    unmuteBtn.onclick = enableSound
    tapPlay.onclick = enableSound

    allowCamBtn.addEventListener('click', async () => {
      camHint.textContent = ''
      allowCamBtn.disabled = true
      allowCamBtn.textContent = 'Requesting…'
      try {
        if (!cameraAvailable()) {
          throw new Error(
            'Camera blocked on insecure HTTP. Use https://' + location.host +
              ' (accept cert warning) or http://127.0.0.1:8081 on this PC.'
          )
        }
        let stream
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: true
          })
        } catch (_) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        }
        sharedStream = stream
        video.srcObject = sharedStream
        video.muted = true
        await video.play().catch(() => {})
        publishBtn.disabled = false
        allowCamBtn.textContent = 'Camera ready'
        allowCamBtn.disabled = false
        log('Camera allowed')
        updateAudioStatus()
      } catch (e) {
        allowCamBtn.disabled = false
        allowCamBtn.textContent = 'Allow camera'
        showCamError('Camera failed: ' + (e && e.message ? e.message : e))
      }
    })

    async function stopSharing() {
      try {
        if (screenStream) {
          screenStream.getTracks().forEach((t) => t.stop())
          screenStream = null
        }
        if (sharedStream && videoSender) {
          const cam = sharedStream.getVideoTracks()[0]
          if (cam) await videoSender.replaceTrack(cam)
          video.srcObject = sharedStream
          video.muted = true
        }
        setSharingUI(false)
        log('Stopped screen share — back to camera')
      } catch (e) {
        log('Stop sharing failed: ' + e)
      }
    }

    screenBtn.onclick = async () => {
      if (!pc || !videoSender) {
        log('Publish first, then share screen')
        return
      }
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false })
        const track = screenStream.getVideoTracks()[0]
        await videoSender.replaceTrack(track)
        video.srcObject = new MediaStream([
          track,
          ...(sharedStream ? sharedStream.getAudioTracks() : [])
        ])
        video.muted = true
        setSharingUI(true)
        track.onended = () => { stopSharing() }
        log('Screen sharing')
      } catch (e) {
        log('Screen share failed: ' + e)
      }
    }

    stopShareBtn.onclick = () => stopSharing()

    muteMicBtn.onclick = () => {
      const tracks = []
      if (sharedStream) tracks.push(...sharedStream.getAudioTracks())
      if (!tracks.length && audioSender && audioSender.track) tracks.push(audioSender.track)
      if (!tracks.length) {
        log('No mic track')
        return
      }
      micMuted = !micMuted
      tracks.forEach((t) => { t.enabled = !micMuted })
      muteMicBtn.textContent = micMuted ? 'Unmute mic' : 'Mute mic'
      updateAudioStatus()
      log(micMuted ? 'Mic muted' : 'Mic unmuted')
    }

    function attachFacesChannel() {
      const dc = pc.createDataChannel('faces', { negotiated: true, id: 1 })
      dc.onopen = () => log('Faces DataChannel open')
      dc.onmessage = (ev) => {
        try {
          applyFaceStatus(JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data)))
        } catch (_) {}
      }
      const tc = pc.createDataChannel('transcripts', { negotiated: true, id: 2 })
      tc.onopen = () => log('Transcript DataChannel open')
      tc.onmessage = (ev) => {
        try {
          applyTranscript(JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data)))
        } catch (_) {}
      }
      const ac = pc.createDataChannel('answers', { negotiated: true, id: 3 })
      ac.onopen = () => log('Answer DataChannel open')
      ac.onmessage = (ev) => {
        try {
          applyAnswer(JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data)))
        } catch (_) {}
      }
      const xc = pc.createDataChannel('translations', { negotiated: true, id: 4 })
      xc.onopen = () => log('Translate DataChannel open')
      xc.onmessage = (ev) => {
        try {
          applyTranslate(JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data)))
        } catch (_) {}
      }
    }

    function waitIceComplete(timeoutMs = 2500) {
      return new Promise((resolve) => {
        if (!pc || pc.iceGatheringState === 'complete') return resolve()
        const done = () => {
          pc.removeEventListener('icegatheringstatechange', onState)
          clearTimeout(timer)
          resolve()
        }
        const onState = () => {
          if (pc.iceGatheringState === 'complete') done()
        }
        pc.addEventListener('icegatheringstatechange', onState)
        pc.onicecandidate = (e) => { if (e.candidate === null) done() }
        const timer = setTimeout(done, timeoutMs)
      })
    }

    async function signalOffer(role) {
      const room = currentRoom()
      if (!room) throw new Error('Enter or create a room first')
      setRoom(room)
      const sdp = btoa(unescape(encodeURIComponent(JSON.stringify(pc.localDescription))))
      log('Signaling (' + role + ') room=' + room + '…')

      // 1) Try WebSocket
      try {
        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws')
        await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('WS open timeout')), 8000)
          ws.onopen = () => { clearTimeout(t); resolve() }
          ws.onerror = () => { clearTimeout(t); reject(new Error('WebSocket failed')) }
        })
        const reply = await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('signaling timeout')), 45000)
          ws.onmessage = (ev) => { clearTimeout(t); resolve(JSON.parse(ev.data)) }
          ws.onerror = () => { clearTimeout(t); reject(new Error('WS message failed')) }
          ws.send(JSON.stringify({ type: 'offer', role, room, sdp }))
        })
        ws.close()
        if (reply.type === 'error') throw new Error(reply.message || 'signal error')
        const remote = JSON.parse(decodeURIComponent(escape(atob(reply.sdp))))
        await pc.setRemoteDescription(remote)
        log('Connected via WebSocket · room ' + room)
        return
      } catch (wsErr) {
        log('WS failed (' + wsErr + ') — trying HTTP…')
      }

      // 2) HTTP fallback (more reliable on mobile + self-signed HTTPS)
      const res = await fetch('/sdp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp, role, room })
      })
      const bodyText = await res.text()
      if (!res.ok) throw new Error(bodyText || ('HTTP ' + res.status))
      const remote = JSON.parse(decodeURIComponent(escape(atob(bodyText))))
      await pc.setRemoteDescription(remote)
      log('Connected via HTTP · room ' + room)
    }

    function showJoinError(msg) {
      log(msg)
      const logs = document.querySelector('details.logs')
      if (logs) logs.open = true
      if (camHint) camHint.textContent = msg
      try { alert(msg) } catch (_) {}
    }

    async function startPublisher() {
      isViewer = false
      lastTranscriptLine = ''
      lastTranslateKey = ''
      transcriptBox.innerHTML = ''
      translateBox.innerHTML = ''
      transcriptStatus.textContent = 'connecting…'
      translateStatus.textContent = 'waiting…'

      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] })
      attachFacesChannel()
      pc.oniceconnectionstatechange = () => {
        log('ICE: ' + pc.iceConnectionState)
        if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed' ||
            pc.iceConnectionState === 'disconnected') {
          log('Publisher link lost — click Publish again')
          publishBtn.disabled = false
          joinBtn.disabled = false
          allowCamBtn.disabled = false
          publisherControls.classList.remove('is-open')
          publisherControls.style.display = 'none'
          faceStatus.textContent = 'offline'
          faceStatus.className = 'no'
        }
      }

      if (!sharedStream || !sharedStream.active) {
        sharedStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      }
      const audioTracks = sharedStream.getAudioTracks()
      if (!audioTracks.length) {
        throw new Error('No microphone track — allow mic access, then Publish again')
      }
      // Prefer audio-first so SDP m-line order matches the server (Whisper needs RTP).
      const ordered = [...audioTracks, ...sharedStream.getVideoTracks()]
      ordered.forEach((track) => {
        track.enabled = true
        const sender = pc.addTrack(track, sharedStream)
        if (track.kind === 'video') videoSender = sender
        if (track.kind === 'audio') audioSender = sender
      })
      log('Publishing tracks: ' + ordered.map((t) => t.kind + ':' + t.readyState).join(', '))
      video.srcObject = sharedStream
      video.muted = true
      await video.play().catch(() => {})
      updateAudioStatus()

      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      await waitIceComplete(2500)
      await signalOffer('publisher')

      publisherControls.classList.add('is-open')
      publisherControls.style.display = 'flex'
      setSharingUI(false)
      muteMicBtn.textContent = 'Mute mic'
      micMuted = false
      log('Publishing — speak clearly for transcript + translate')
    }

    async function startViewer() {
      isViewer = true
      publisherControls.classList.remove('is-open')
      publisherControls.style.display = 'none'
      if (camHint) camHint.textContent = 'Joining room…'

      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] })
      attachFacesChannel()
      pc.oniceconnectionstatechange = () => log('ICE: ' + pc.iceConnectionState)

      pc.addTransceiver('video', { direction: 'recvonly' })
      pc.addTransceiver('audio', { direction: 'recvonly' })
      const remoteStream = new MediaStream()
      video.srcObject = remoteStream
      video.muted = true
      video.setAttribute('playsinline', 'true')
      video.playsInline = true
      video.controls = true
      unmuteBtn.style.display = 'inline-block'
      updateAudioStatus()

      pc.ontrack = (event) => {
        if (!remoteStream.getTrackById(event.track.id)) remoteStream.addTrack(event.track)
        event.track.enabled = true
        log('Got remote ' + event.track.kind)
        updateAudioStatus()
        video.play().catch(() => { tapPlay.style.display = 'block' })
        if (event.track.kind === 'audio') {
          // Mobile browsers often block unmute until tap — show button.
          unmuteBtn.style.display = 'inline-block'
          tapPlay.style.display = 'block'
        } else if (!playArmed) {
          playArmed = true
        }
      }

      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      await waitIceComplete(2500)
      await signalOffer('viewer')
      if (camHint) camHint.textContent = 'Joined — tap video / Enable sound if needed'
      log('Joined')
    }

    publishBtn.onclick = async () => {
      try {
        if (!currentRoom()) {
          const res = await fetch('/room/new', { method: 'POST' })
          const data = await res.json()
          setRoom(data.room)
          log('Auto room: ' + data.room)
        }
        allowCamBtn.disabled = true
        publishBtn.disabled = true
        joinBtn.disabled = true
        await startPublisher()
      } catch (e) {
        log('Publish failed: ' + e)
        allowCamBtn.disabled = false
        publishBtn.disabled = false
        joinBtn.disabled = false
      }
    }

    async function onJoinClick() {
      if (joinBtn.dataset.busy === '1') return
      joinBtn.dataset.busy = '1'
      try {
        if (!currentRoom()) throw new Error('Room code missing — open the Copy link URL, or type the room code')
        joinBtn.disabled = true
        joinBtn.textContent = 'Joining…'
        publishBtn.disabled = true
        await startViewer()
        joinBtn.textContent = 'Joined'
      } catch (e) {
        joinBtn.disabled = false
        joinBtn.textContent = 'Join broadcast'
        publishBtn.disabled = false
        allowCamBtn.disabled = false
        showJoinError('Join failed: ' + (e && e.message ? e.message : e))
      } finally {
        setTimeout(() => { joinBtn.dataset.busy = '0' }, 800)
      }
    }
    joinBtn.addEventListener('click', onJoinClick)
  </script>
</body>
</html>
