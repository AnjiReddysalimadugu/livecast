services:
  - type: web
    name: livecast
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: LIVECAST_CLOUD
        value: "1"
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_LANGUAGE
        value: en
      # Free Metered Open Relay — required for WebRTC on Render (no public UDP).
      # https://www.metered.ca/tools/openrelay/ → set in Render Dashboard:
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
