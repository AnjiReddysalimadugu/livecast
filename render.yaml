services:
  - type: web
    name: livecast
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: LIVECAST_CLOUD
        value: "1"
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_LANGUAGE
        value: en
      - key: VOICE_ASSIST
        value: "1"
      - key: STT_BACKEND
        value: auto
      - key: STT_MODEL
        value: gpt-transcribe
      # Optional: smarter STT + voice replies (OpenAI). Without key → local Whisper tiny.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Free Metered Open Relay — required on Render (no public UDP).
      # https://www.metered.ca/tools/openrelay/
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
